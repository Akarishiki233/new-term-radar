[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "new-term-radar"
version = "0.2.0"
description = "Names that are starting to surge in AI, and the generic search terms behind them"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
mail = ["markdown>=3.5"]
mcp = ["mcp>=1.2"]

[project.scripts]
new-term-radar = "radar.__main__:main"
new-term-radar-mcp = "radar.mcp_server:main"

[tool.setuptools]
packages = ["radar"]
